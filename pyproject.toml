[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "property-risk-engine"
version = "0.1.0"
description = "Deterministic, evidence-led Australian property buyer assessment engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.1", "pydantic==2.13.4",
  "httpx==0.28.1", "socksio==1.0.0", "shapely==2.1.2", "pyproj==3.7.2", "openpyxl==3.1.5"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
property-risk = "riskengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

